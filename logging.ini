[loggers]
keys=root,uvicorn,app

[handlers]
keys=console

[formatters]
keys=std

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn

[logger_app]
level=INFO
handlers=console
qualname=app

[handler_console]
class=StreamHandler
level=INFO
formatter=std
args=(sys.stdout,)

[formatter_std]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
